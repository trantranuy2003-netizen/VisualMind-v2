<!doctype html><meta charset="utf-8"><pre id="result">RUNNING</pre>
<script>
localStorage.setItem('visualmind-language','en');localStorage.setItem('visualmind-theme','light');
localStorage.setItem('visualmind-weekly-planner',JSON.stringify({items:[],recurring:[]}));localStorage.setItem('visualmind-eisenhower-tasks','[]');localStorage.setItem('visualmind-radar','{}');
const frame=document.createElement('iframe');frame.src='../index.html';frame.style='width:1400px;height:1000px';document.body.append(frame);
frame.onload=async()=>{try{
const w=frame.contentWindow,d=frame.contentDocument,C=w.ChecklistModel;await new Promise(r=>setTimeout(r,200));
if(!d.querySelector('[data-wheel]'))throw Error('Wheel missing');
if(d.querySelectorAll('[data-checklist-group]').length!==4)throw Error('Four sections missing');
if(d.querySelector('.weekly-panel'))throw Error('Old week plan still visible');
const input=d.querySelector('.home-search input');if(w.getComputedStyle(input).backgroundColor!=='rgb(255, 255, 255)')throw Error('Light search background incorrect');
C.commit({items:[{id:'task',title:'User text',kind:'task'}],recurring:[]});
const drag=(id,target)=>{const data=new w.DataTransfer();data.setData('application/x-checklist-task',JSON.stringify({id,date:C.today()}));target.dispatchEvent(new w.DragEvent('drop',{bubbles:true,cancelable:true,dataTransfer:data}));};
if(d.querySelectorAll('[data-checklist-group] .todo-group-heading button').length!==4)throw Error('Each section needs an add button');
if(!d.querySelector('[data-checklist-trash] svg'))throw Error('Original trash icon missing');
drag('task',d.querySelector('[data-task-list="do"]'));
if(!d.querySelector('.checklist-panel [data-checklist-task="task"]').classList.contains('is-in-matrix'))throw Error('Checklist copy must be faded');
if(d.querySelector('[data-checklist-task] select'))throw Error('Move dropdown must be removed');
d.querySelector('.matrix-dropzone input').click();if(!C.all()[0].completed)throw Error('Matrix completion not persisted');
d.querySelector('.matrix-dropzone [data-return-checklist]').click();
if(d.querySelector('.checklist-panel .is-in-matrix'))throw Error('Return must remove faded state');
if(!d.querySelector('.checklist-panel input[type=checkbox]').checked)throw Error('Completion lost on returning');
d.querySelector('.wheel-hit').dispatchEvent(new w.MouseEvent('click'));
const add=[...d.querySelectorAll('.wheel-dialog button')].find(n=>n.textContent.includes('Add goal'));add.click();
let form=d.querySelectorAll('.wheel-form');form=form[form.length-1];form.elements.goalName.value='Goal';form.elements.goalWeight.value='100';form.dispatchEvent(new w.Event('submit',{cancelable:true}));
if(w.WheelModel.load().goals.length!==1)throw Error('Goal not saved');
const goal=w.WheelModel.load().goals[0];w.editChecklistTask(null,{wheelGoalId:goal.id});form=d.querySelectorAll('.wheel-form');form=form[form.length-1];form.elements.taskName.value='Linked task';form.elements.taskWeight.value='100';form.elements.cap.value='2';form.dispatchEvent(new w.Event('submit',{cancelable:true}));
const linked=C.all().find(t=>t.wheelGoalId===goal.id);if(!linked)throw Error('Wheel task not shared');C.toggle(linked.id,C.today(),true);if(w.WheelModel.score(w.WheelModel.load(),goal.categoryId).actual!==5)throw Error('Radar not updated');
d.querySelector('[data-language-choice="vi"]').click();await new Promise(r=>setTimeout(r,50));if([...d.querySelectorAll('.wheel-dialog [data-ui-key="addGoal"]')].some(n=>!n.textContent.includes('Thêm Goal')))throw Error('Open modal label did not switch');
d.querySelectorAll('.library-dialog-overlay').forEach(n=>n.remove());
d.querySelector('[data-language-choice="vi"]').click();await new Promise(r=>setTimeout(r,50));if(!d.querySelector('[data-wheel]').textContent.includes('Mai rùa'))throw Error('Vietnamese switch failed');
d.querySelector('[data-language-choice="en"]').click();await new Promise(r=>setTimeout(r,50));if(!d.querySelector('[data-wheel]').textContent.includes('Wheel of Life'))throw Error('English switch failed');
w.editChecklistTask(C.all().find(t=>t.id==='task'));form=d.querySelector('.wheel-form');form.elements.start.value=C.today().split('-').reverse().join('/');form.dispatchEvent(new w.Event('submit',{cancelable:true}));
const calendarTask=[...d.querySelectorAll('.calendar-event-title')].find(n=>n.textContent==='User text');if(!calendarTask)throw Error('Checklist schedule not synced to Calendar');calendarTask.click();
form=d.querySelector('.calendar-editor');form.elements.title.value='Edited in Calendar';form.dispatchEvent(new w.Event('submit',{cancelable:true}));
if(!d.querySelector('[data-checklist-group="scheduled"]').textContent.includes('Edited in Calendar'))throw Error('Calendar edit not synced to Checklist');
drag('task',d.querySelector('[data-checklist-trash] svg'));
if(!C.all().find(t=>t.id==='task').trashedAt||d.querySelector('[data-checklist-task="task"]'))throw Error('Drop in trash did not remove task');
d.querySelector('[data-checklist-trash]').click();d.querySelector('.trash-restore').click();d.querySelector('.trash-close').click();if(C.all().find(t=>t.id==='task').trashedAt)throw Error('Trash restore failed');
d.querySelector('[data-checklist-group="recurring"] .todo-group-heading button').click();form=d.querySelector('.wheel-form');form.elements.taskName.value='Monday and Tuesday';form.elements.start.value='14/09/2026';form.elements.end.value='';form.elements.fromTime.value='23:00';form.elements.endToTime.value='01:00';
form.querySelector('[data-repeat-day="none"]').click();form.querySelector('[data-repeat-day="1"]').click();form.querySelector('[data-repeat-day="2"]').click();form.dispatchEvent(new w.Event('submit',{cancelable:true}));
const repeating=C.all().find(t=>t.title==='Monday and Tuesday');if(!repeating||repeating.durationMinutes!==120||repeating.repeat!=='weekly'||repeating.repeatDays.join(',')!=='1,2')throw Error('Weekday recurrence or overnight duration incorrect');
if(!w.CalendarModel.occurs(repeating,'2026-09-21')||!w.CalendarModel.occurs(repeating,'2026-09-22')||w.CalendarModel.occurs(repeating,'2026-09-23'))throw Error('Repeat must occur every Monday and Tuesday');
w.editChecklistTask(repeating);form=d.querySelector('.wheel-form');form.elements.start.value='31/02/2026';form.dispatchEvent(new w.Event('submit',{cancelable:true}));if(!form.querySelector('[role="alert"]').textContent)throw Error('Invalid date accepted');form.elements.start.value='14/09/2026';form.elements.end.value='15/09/2026';form.querySelector('[data-repeat-day="none"]').click();form.dispatchEvent(new w.Event('submit',{cancelable:true}));if(C.all().find(t=>t.id===repeating.id).repeat)throw Error('No must disable recurrence');
if(d.querySelector('.wheel-settings').textContent!=='⚙')throw Error('Settings must use a gear');
d.querySelector('.wheel-settings').click();form=d.querySelector('.wheel-form');const axisCount=w.WheelModel.load().categories.length;
form.querySelector('.wheel-axis-row input').value='Renamed axis';form.querySelector('[data-ui-key="addAxis"]').click();form.querySelector('.wheel-axis-row:last-child input').value='New axis';form.dispatchEvent(new w.Event('submit',{cancelable:true}));
if(d.querySelectorAll('.wheel-hit').length!==axisCount+1||!d.querySelector('.wheel-chart').textContent.includes('Renamed axis'))throw Error('Radar must update added/renamed axes');
d.querySelector('.wheel-settings').click();form=d.querySelector('.wheel-form');form.querySelector('.wheel-axis-row button').click();form.dispatchEvent(new w.Event('submit',{cancelable:true}));
if(d.querySelectorAll('.wheel-hit').length!==axisCount||!w.WheelModel.load().goals.some(item=>item.id===goal.id))throw Error('Remove must update radar and retain goals');
d.querySelector('.wheel-settings').click();form=d.querySelector('.wheel-form');form.querySelector('[data-ui-key="restoreAxis"]').click();form.dispatchEvent(new w.Event('submit',{cancelable:true}));
[...d.querySelectorAll('.wheel-hit')].find(n=>n.getAttribute('aria-label').startsWith('Renamed axis')).dispatchEvent(new w.MouseEvent('click'));
let tree=d.querySelector('.wheel-tree-goal');if(!tree||!tree.querySelector('.wheel-goal-icon svg')||!tree.querySelector('.wheel-task-icon'))throw Error('Goal/task tree icons missing');
tree.querySelector('[aria-controls]').click();if(!tree.querySelector('.wheel-tree-children').hidden)throw Error('Children must collapse');tree.querySelector('[aria-controls]').click();
let taskRow=d.querySelector('[data-wheel-task]');const before=Number(taskRow.querySelector('.wheel-done-count').textContent);taskRow.querySelector('input').click();taskRow=d.querySelector('[data-wheel-task]');if(Number(taskRow.querySelector('.wheel-done-count').textContent)===before)throw Error('Done counter must update from completion');taskRow.querySelector('input').click();
document.querySelector('#result').textContent='PASS: Checklist, Calendar, matrix, weights, gear settings, add/remove/restore axes, goal/task tree and live completion counts.';
}catch(error){document.querySelector('#result').textContent='FAIL: '+error.stack;}};
</script>
