<!doctype html><meta charset="utf-8"><title>Mindmap feature checks</title>
<pre id="result">RUNNING</pre><iframe id="app" style="width:1200px;height:850px"></iframe>
<script>
const assert = (value, message) => { if (!value) throw Error(message); };
const delay = ms => new Promise(resolve => setTimeout(resolve, ms));
(async () => {
    const node = (id, text, parent, x, y) => ({ id, text, parent, x, y, width: 160, height: 60, fontSize: 14, color: '#A8D8EA', children: [], collapsed: false, textStyles: [] });
    const a = node(1, 'Root', null, 0, 0), b = node(2, 'Branch', 1, 240, 0), c = node(3, 'Hidden needle', 2, 480, 0);
    a.children = [2]; b.children = [3]; b.collapsed = true;
    const sample = { center: 1, nodes: { 1: a, 2: b, 3: c }, nextId: 4, links: [], groups: [], flashcards: [], nextFlashcardId: 1 };
    localStorage.setItem('visualmind-local-mindmaps', JSON.stringify({ 'feature-test': sample }));
    localStorage.setItem('visualmind-library', JSON.stringify([{ id: 'feature-test', name: 'Feature test', kind: 'mindmap', children: [] }]));
    localStorage.setItem('visualmind-language', 'vi');
    const frame = document.querySelector('#app');
    await new Promise(resolve => { frame.onload = resolve; frame.src = '../mindmap.html?mapId=feature-test&test=1'; });
    const w = frame.contentWindow, d = w.document;
    await delay(500);
    assert(w.testErrors.length === 0, 'Startup errors: ' + w.testErrors.join('; '));
    assert(d.querySelector('.library-node'), 'Shared library loads');
    const evaluate = code => w.eval(code);
    evaluate("mindmap.nodes[1].text='First edit'; saveHistory(); undo();");
    assert(evaluate('mindmap.nodes[1].text') === 'Root', 'Undo first edit after load');
    evaluate("for(let n=0;n<70;n++){mindmap.nodes[1].text='Edit '+n;saveHistory();} undo();");
    assert(evaluate('mindmap.nodes[1].text') === 'Edit 68', 'Undo after >50 snapshots');
    evaluate("redo();"); assert(evaluate('mindmap.nodes[1].text') === 'Edit 69', 'Redo after >50 snapshots');
    const search = d.querySelector('.mm-tools input'); search.value = 'needle'; search.dispatchEvent(new w.Event('input'));
    d.querySelector('[data-search-node="3"]').click();
    assert(evaluate('mindmap.nodes[2].collapsed') === false && evaluate('selection.nodeId') === 3, 'Search reveals ancestor and focuses result');
    search.value = ''; search.dispatchEvent(new w.Event('input'));
    const canvas = d.querySelector('#canvas'); canvas.focus();
    canvas.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Tab', bubbles: true, cancelable: true }));
    assert(evaluate('mindmap.nodes[3].children.length') === 1, 'Tab creates child');
    const editor = d.querySelector('.inline-edit'); editor.value = 'Child via keyboard'; editor.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
    assert(d.activeElement === canvas, 'Editing returns focus to canvas');
    canvas.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true }));
    assert(evaluate('mindmap.nodes[3].children.length') === 2, 'Enter creates sibling');
    d.querySelector('.inline-edit').dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
    w.MM.fit(); assert(evaluate('viewport.zoom') > 0, 'Fit produces a valid viewport');
    assert(!d.querySelector('.mm-minimap'), 'Minimap removed');
    // Real renderer is used by both export formats, including off-screen nodes.
    evaluate('mindmap.nodes[2].collapsed=true;');
    const before = evaluate('JSON.stringify(mindmap)'), svg = w.MindmapExport.capture('svg');
    assert(svg.includes('needle') && svg.includes('<text') && svg.includes('<path'), 'SVG includes hidden branches and vector text');
    assert(!new w.DOMParser().parseFromString(svg, 'image/svg+xml').querySelector('parsererror'), 'Export is valid SVG');
    const png = w.MindmapExport.capture('png', 2);
    assert(png.width > 100 && png.toDataURL().startsWith('data:image/png'), 'PNG renders at selected resolution');
    assert(evaluate('JSON.stringify(mindmap)') === before, 'Export does not change collapsed state or document');
    const nativeOpen = w.open; let printed = false, printMarkup = '';
    w.open = () => ({ document: { write: value => { printMarkup = value; }, close() {}, fonts: { ready: Promise.resolve() } }, focus() {}, print() { printed = true; }, close() {} });
    w.openMindmapExport('pdf'); d.querySelector('.mm-dialog form').requestSubmit();
    for (let n = 0; n < 30 && !printed; n++) await delay(100);
    w.open = nativeOpen;
    assert(printed && printMarkup.includes('<svg') && !printMarkup.includes('<img'), 'PDF print flow uses vectors rather than a screenshot');
    await w.MindmapVersions.flush();
    assert((await w.MindmapVersions.list('feature-test')).length > 0, 'Versions persist in IndexedDB');
    const original = evaluate('JSON.parse(JSON.stringify(mindmap))'); await w.MindmapVersions.write('feature-test', original, true);
    evaluate("mindmap.nodes[1].text='Later version';saveHistory();");
    d.querySelector('[data-mm-en="Versions"]').click(); await delay(300);
    const restore = [...d.querySelectorAll('.mm-version-row')].at(-1).querySelector('button'); restore.click(); await delay(300);
    assert(evaluate('mindmap.nodes[1].text') !== 'Later version', 'Version restores previous content');
    evaluate('undo()'); assert(evaluate('mindmap.nodes[1].text') === 'Later version', 'Version restore can be undone');
    w.MM.focusNode(2);
    d.querySelector('[data-mm-en="Create task"]').click();
    let form = d.querySelector('.mm-dialog form'); form.elements.title.value = 'Branch task'; form.requestSubmit();
    const planner = JSON.parse(localStorage.getItem('visualmind-weekly-planner'));
    assert(planner.items.at(-1).mindmapSource.nodeId === 2, 'Calendar task links back to branch');
    d.querySelector('[data-mm-en="Create flashcards"]').click();
    form = d.querySelector('.mm-dialog form'); form.requestSubmit();
    const deck = JSON.parse(localStorage.getItem('visualmind-local-mindmaps'))['flashcard-workspace'];
    assert(deck.flashcards.length > 0 && deck.flashcards.every(card => card.mindmapSource.mapId === 'feature-test'), 'Flashcard deck retains source links');
    d.querySelector('.mm-dialog header button').click();
    assert(d.querySelector('[data-key="btn-save-image"]').textContent.includes('Xuất'), 'Vietnamese export labels');
    localStorage.setItem('visualmind-language', 'en'); d.dispatchEvent(new w.CustomEvent('visualmind-preferences', { detail: { language: 'en' } })); await delay(50);
    assert(d.querySelector('[data-key="btn-save-image"]').textContent.includes('Image'), 'English labels switch');
    canvas.setPointerCapture = () => {};
    const rect = canvas.getBoundingClientRect();
    const touch = (type, id, x, y) => canvas.dispatchEvent(new w.PointerEvent(type, { pointerType: 'touch', pointerId: id, clientX: rect.left + x, clientY: rect.top + y, bubbles: true, cancelable: true }));
    const oldZoom = evaluate('viewport.zoom');
    touch('pointerdown', 1, 20, 250); touch('pointerdown', 2, 100, 250); touch('pointermove', 2, 180, 250); touch('pointerup', 2, 180, 250); touch('pointerup', 1, 20, 250);
    assert(evaluate('viewport.zoom') > oldZoom, 'Two-finger pinch changes zoom');
    const oldX = evaluate('viewport.x'); touch('pointerdown', 3, 10, 10); touch('pointermove', 3, 45, 35); touch('pointerup', 3, 45, 35);
    assert(evaluate('viewport.x') !== oldX, 'One-finger pan changes viewport');
    const cardsFrame = document.createElement('iframe'); cardsFrame.style.display = 'none'; document.body.append(cardsFrame);
    await new Promise(resolve => { cardsFrame.onload = resolve; cardsFrame.src = '../flashcard.html?test=1&deckId=' + deck.flashcards[0].deckId; }); await delay(200);
    const cardsWindow = cardsFrame.contentWindow;
    assert(cardsWindow.testErrors.length === 0, 'Flashcard page starts without errors: ' + cardsWindow.testErrors.join('; '));
    const sourceLink = cardsWindow.document.querySelector('#fcLinkedBadge a');
    assert(sourceLink && sourceLink.href.includes('nodeId='), 'Studying a card exposes source link');
    await new Promise(resolve => { cardsFrame.onload = resolve; cardsFrame.src = sourceLink.href + '&test=1'; }); await delay(300);
    assert(cardsFrame.contentWindow.eval('selection.nodeId') === deck.flashcards[0].mindmapSource.nodeId, 'Source link opens exact node');
    assert((await cardsFrame.contentWindow.MindmapVersions.list('feature-test')).length > 0, 'Version history survives navigation/reload');
    cardsFrame.remove();
    assert(w.testErrors.length === 0, 'Runtime errors: ' + w.testErrors.join('; '));
    document.querySelector('#result').textContent = 'PASS: startup, bounded undo/redo, first edit, search, keyboard, fit, touch pan/pinch, PNG/SVG, versions/restore/reload/undo, task/flashcard round-trip, languages.';
})().catch(error => { document.querySelector('#result').textContent = 'FAIL: ' + error.stack; });
</script>
